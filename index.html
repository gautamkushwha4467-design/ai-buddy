<!DOCTYPE html>
<html>
<head>
  <title>AI Career Companion</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #F9FAFB;
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      justify-content: space-between;
      padding: 15px 40px;
      background: black;
      color: white;
    }

    .navbar h2 {
      font-weight: 500;
    }

    .nav-btn {
      background: white;
      color: black;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* HERO */
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 60px;
      background: linear-gradient(135deg,#4F46E5,#9333EA);
      color: white;
    }

    .hero-text h1 {
      font-size: 42px;
    }

    .hero-text p {
      margin: 15px 0;
    }

    .hero-text button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: white;
      color: #4F46E5;
      cursor: pointer;
    }

    .hero img {
      width: 350px;
      border-radius: 15px;
    }

    /* DASHBOARD */
    .main {
      padding: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .progress {
      height: 8px;
      background: #ddd;
      border-radius: 10px;
      margin-top: 10px;
    }

    .progress-bar {
      height: 100%;
      width: 70%;
      background: linear-gradient(90deg,#4F46E5,#9333EA);
    }

    /* FLOATING CHAT */
    #chatButton {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #4F46E5;
      color: white;
      padding: 15px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    #chatPopup {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 300px;
      height: 400px;
      background: white;
      border-radius: 15px;
      display: none;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .chat-header {
      background: #4F46E5;
      color: white;
      padding: 10px;
      display: flex;
      justify-content: space-between;
    }

    #chatbox {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }

    .msg {
      padding: 8px;
      margin: 5px;
      border-radius: 10px;
      max-width: 70%;
    }

    .user {
      background: #4F46E5;
      color: white;
      margin-left: auto;
    }

    .ai {
      background: #eee;
    }

    .chat-input {
      display: flex;
      padding: 10px;
    }

    .chat-input input {
      flex: 1;
      padding: 8px;
    }

    .chat-input button {
      padding: 8px;
      background: #4F46E5;
      color: white;
      border: none;
    }

  </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <h2>🚀 AI Companion</h2>
  <div class="nav-btn">Login</div>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-text">
    <h1>AI Career Companion</h1>
    <p>From learning to career — guided by AI</p>
    <button onclick="scrollToDashboard()">Get Started</button>
  </div>

  <img src="https://images.unsplash.com/photo-1581090700227-1e8a0e6f2f0b" />
</div>

<!-- DASHBOARD -->
<div class="main" id="dashboard">

  <div class="grid">
    <div class="card">
      <h3>🎯 Career Path</h3>
      <p>Software Developer</p>
    </div>

    <div class="card">
      <h3>📊 Progress</h3>
      <div class="progress">
        <div class="progress-bar"></div>
      </div>
      <p>70% Completed</p>
    </div>
  </div>

  <div class="card">
    <h3>📚 Learning Roadmap</h3>
    <p>✔ Basics</p>
    <p>✔ Projects</p>
    <p>➡ Advanced</p>
  </div>

</div>

<!-- CHAT BUTTON -->
<div id="chatButton" onclick="toggleChat()">💬</div>

<!-- CHAT POPUP -->
<div id="chatPopup">
  <div class="chat-header">
    🤖 AI Friend
    <span onclick="toggleChat()">✖</span>
  </div>

  <div id="chatbox"></div>

  <div class="chat-input">
    <input id="userInput" placeholder="Ask anything...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
function toggleChat(){
  let popup = document.getElementById("chatPopup");
  popup.style.display = popup.style.display === "flex" ? "none" : "flex";
}

function sendMessage(){
  let input = document.getElementById("userInput");
  let msg = input.value;
  if(!msg) return;

  let chat = document.getElementById("chatbox");
  chat.innerHTML += `<div class="msg user">${msg}</div>`;

  let reply = "Hey! I'm your AI buddy. Let’s build your future 🚀";

  setTimeout(()=>{
    chat.innerHTML += `<div class="msg ai">${reply}</div>`;
    chat.scrollTop = chat.scrollHeight;
  },500);

  input.value="";
}

function scrollToDashboard(){
  document.getElementById("dashboard").scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
